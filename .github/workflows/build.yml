name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip dosyasini ac
        run: |
          mkdir -p build_src
          unzip -q "$(ls *.zip | head -1)" -d build_src
          ls -R build_src/app/src/main/res | head -30
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK derle
        working-directory: build_src
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Yanki-APK
          path: build_src/app/build/outputs/apk/debug/*.apk
